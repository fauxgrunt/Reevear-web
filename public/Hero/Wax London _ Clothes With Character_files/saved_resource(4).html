function getLangFromCookie(checkoutLocale) {
  var cookies = document.cookie.split(';');
  for (var i = 0; i < cookies.length; i++) {
    var cookie = cookies[i].trim();
    if (cookie.startsWith('weglot_lang=')) {
      return cookie.substring('weglot_lang='.length);
    }
  }
  return checkoutLocale || 'en';
}

function sendLangToKlaviyo(email, lang) {
  if (!email) return;
  fetch('https://a.klaviyo.com/client/profiles/?company_id=WkTqs3', {
    method: 'POST',
    headers: {
      'content-type': 'application/json',
      'revision': '2024-02-15'
    },
    body: JSON.stringify({
      data: {
        type: 'profile',
        attributes: {
          email: email,
          properties: { lang: lang }
        }
      }
    })
  });
}

// Catches returning/logged-in customers

  var email = event.data.checkout.email;
  var lang = getLangFromCookie(event.data.checkout.locale);
  sendLangToKlaviyo(email, lang);
});

// Catches all new customers when they submit email
